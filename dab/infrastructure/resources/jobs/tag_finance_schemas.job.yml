resources:
  jobs:
    tag_finance_schemas:
      name: tag_finance_schemas
      tags:
        Finance: ""
        environment: ${var.environment}
      tasks:
        - task_key: apply_governed_tags
          notebook_task:
            notebook_path: ../../src/tag_finance_schemas.py
            base_parameters:
              catalog: ${var.catalog}
              erp_bronze_schema: ${resources.schemas.erp_bronze.name}
              erp_silver_schema: ${resources.schemas.erp_silver.name}
              erp_gold_schema: ${resources.schemas.erp_gold.name}
