resources:
  schemas:
    erp_bronze:
      name: ${var.erp_bronze_schema}
      catalog_name: ${var.catalog}
      comment: "Finance ERP bronze data"
      grants:
        - principal: grp-finance-bronze-reader
          privileges: [SELECT, USE_SCHEMA]

    erp_silver:
      name: ${var.erp_silver_schema}
      catalog_name: ${var.catalog}
      comment: "Finance ERP silver data"
      grants:
        - principal: grp-finance-silver-reader
          privileges: [SELECT, USE_SCHEMA]

    erp_gold:
      name: ${var.erp_gold_schema}
      catalog_name: ${var.catalog}
      comment: "Finance ERP gold data"
      grants:
        - principal: grp-finance-gold-reader
          privileges: [SELECT, USE_SCHEMA]
