resources:
  schemas:
    crm_bronze:
      name: crm_bronze
      catalog_name: ${var.catalog}
      comment: "CRM schema for bronze data"
      grants:
          - principal: grp-finance-bronze-reader
            privileges: [SELECT, USE_SCHEMA]

    crm_silver:
        name: crm_silver
        catalog_name: ${var.catalog}
        comment: "CRM schema for silver data"
        grants:
            - principal: grp-finance-silver-reader
              privileges: [SELECT, USE_SCHEMA]

    crm_gold:
      name: crm_gold
      catalog_name: ${var.catalog}
      comment: "CRM schema for gold data"
      grants:
          - principal: grp-finance-gold-reader
            privileges: [SELECT, USE_SCHEMA]