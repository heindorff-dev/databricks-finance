targets:
  dev: 
    mode: development
    default: true
    permissions:
      - group_name: grp-developer
        level: CAN_MANAGE

    variables:
      catalog: finance_dev
      pause_status: PAUSED
      crm_bronze_schema: "dev_${workspace.current_user.short_name}_crm_bronze"
      crm_silver_schema: "dev_${workspace.current_user.short_name}_crm_silver"
      crm_gold_schema: "dev_${workspace.current_user.short_name}_crm_gold"

    workspace:
      host: https://dbc-5346a843-c2e6.cloud.databricks.com/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev